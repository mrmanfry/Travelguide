# Le prove del motore, a ogni push e su ogni pull request.
# Niente segreti e niente rete verso i modelli: le prove usano client finti.
name: Prove del motore

on:
  push:
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt
      - name: Librerie di sistema per WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
      - name: Dipendenze
        run: pip install -r requirements-dev.txt
      - name: Prove
        run: python -m pytest -q
